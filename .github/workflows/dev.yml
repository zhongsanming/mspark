name: Development

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.envrc'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Reads the pinned channel and components from rust-toolchain.toml.
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Format Check
      run: cargo fmt --all --check

    - name: Clippy Check
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Build
      run: cargo build --workspace --verbose

    - name: Test
      run: cargo test --workspace --verbose

    # Byte-exactness is not required; the closeness baseline in
    # `spec/baseline.txt` is. This step needs a profiling capture, which CI does
    # not ship, so it is skipped unless one is provided (self-hosted runs or a
    # downloaded artefact) via MSPARK_PROFILE.
    - name: Verify against goldens (ratchet)
      if: ${{ env.MSPARK_PROFILE != '' }}
      run: cargo run --release -- verify-all "$MSPARK_PROFILE"

  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Building package
        run: nix build
