name: Development

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.envrc'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.target }}-${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        target: [ x86_64-unknown-linux-gnu ]
        toolchain: [ stable, nightly ]

    steps:
    - uses: actions/checkout@v7

    - name: Setup Rust Toolchain
      uses: hecrj/setup-rust-action@v2
      with:
        rust-version: ${{ matrix.toolchain }}
        targets: ${{ matrix.target }}
        components: rustfmt, clippy

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ matrix.os }}-${{ matrix.target }}-${{ matrix.toolchain }}

    - name: Format Check
      run: cargo fmt --check

    - name: Clippy Check
      run: cargo clippy -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Test
      run: cargo test --verbose

    # Byte-exactness is not required; the closeness baseline in
    # `spec/baseline.txt` is. This step needs a profiling capture, which CI does
    # not ship, so it is skipped unless one is provided (self-hosted runs or a
    # downloaded artefact) via MSPARK_PROFILE.
    - name: Verify against goldens (ratchet)
      if: ${{ env.MSPARK_PROFILE != '' }}
      run: cargo run --release -- verify-all "$MSPARK_PROFILE"

  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Building package
        run: nix build 
