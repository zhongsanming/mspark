name: Tag on Version-Bump Merge

# Merging the monthly bump PR is the approval step; this creates the tag that
# `publish.yml` reacts to. Keeping tagging separate from the bump means the
# version in `Cargo.toml` and the tag can never disagree: the tag is read back out
# of the merged file.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag-release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          # Use the PAT, not the automatic GITHUB_TOKEN: events caused by
          # GITHUB_TOKEN never trigger further workflow runs, so the publish job
          # would not fire for the tag pushed here.
          token: ${{ secrets.GH_PAT }}

      - name: Detect version-bump PR
        id: detect
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TITLE="${{ github.event.pull_request.title }}"

          if [[ "$BRANCH" == "chore/monthly-version-bump" ]] || [[ "$TITLE" == *"bump version"* ]]; then
            echo "is_version_bump=true" >> "$GITHUB_OUTPUT"
            echo "✅ Detected version-bump PR — proceeding to tag."
          else
            echo "is_version_bump=false" >> "$GITHUB_OUTPUT"
            echo "Is not a version-bump PR — skipping tag creation."
          fi

      - name: Extract new version
        if: steps.detect.outputs.is_version_bump == 'true'
        id: version
        run: |
          set -euo pipefail
          # The merged `Cargo.toml` is the source of truth; `[workspace.package]`
          # is the first bare `version = "…"` line in the file.
          NEW_VERSION=$(grep -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml | head -1)

          if [ -z "$NEW_VERSION" ]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Extracted version: $NEW_VERSION"

      - name: Create Git tag
        if: steps.detect.outputs.is_version_bump == 'true'
        run: |
          set -euo pipefail
          NEW_TAG="${{ steps.version.outputs.new_tag }}"

          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "⚠️ Tag $NEW_TAG already exists — skipping creation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

          echo "✅ Tag $NEW_TAG created and pushed."
