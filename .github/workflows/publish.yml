name: Publish to crates.io

# Triggered by the tag that `tag-on-merge.yml` pushes after the monthly bump PR
# merges, so a release is: monthly PR → merge → tag → publish.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  # Dependency order: a crate is published only after its dependencies are on the
  # registry. Keep this list in that order when adding a crate.
  CRATES: "mspark-df mspark-model mspark"

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Reads the pinned channel and components from rust-toolchain.toml.
      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the workspace version
        run: |
          set -euo pipefail
          WORKSPACE_VERSION=$(grep -oP '^version = "\K[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml | head -1)
          if [ "v$WORKSPACE_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $WORKSPACE_VERSION"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches the workspace version"

      - name: Build and test before publishing
        run: |
          set -euo pipefail
          cargo build --workspace --release --locked
          cargo test --workspace --locked

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # Publishing a crate verifies its tarball against the *registry* copy of
          # its dependencies, and index propagation is asynchronous — so after each
          # publish, wait until that version is actually served before moving on.
          index_path() {
            local name="$1"
            case "${#name}" in
              1) echo "1/$name" ;;
              2) echo "2/$name" ;;
              3) echo "3/${name:0:1}/$name" ;;
              *) echo "${name:0:2}/${name:2:2}/$name" ;;
            esac
          }

          wait_for_index() {
            local name="$1" path
            path=$(index_path "$name")
            for attempt in $(seq 1 60); do
              if curl -sf "https://index.crates.io/$path" | grep -q "\"vers\":\"$VERSION\""; then
                echo "$name $VERSION is on the registry"
                return 0
              fi
              echo "waiting for $name $VERSION in the index ($attempt/60)"
              sleep 10
            done
            echo "::error::$name $VERSION never appeared in the index"
            return 1
          }

          already_published() {
            curl -sf "https://crates.io/api/v1/crates/$1/$VERSION" >/dev/null
          }

          for crate in $CRATES; do
            if already_published "$crate"; then
              echo "::notice::$crate $VERSION is already published — skipping"
              continue
            fi
            echo "publishing $crate $VERSION"
            cargo publish --locked --package "$crate"
            wait_for_index "$crate"
          done

      - name: Summary
        run: |
          {
            echo "### Published ${GITHUB_REF_NAME}"
            echo
            echo "| crate | version |"
            echo "| --- | --- |"
            for crate in $CRATES; do
              echo "| $crate | ${GITHUB_REF_NAME#v} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Discard the registry token
        if: always()
        run: echo "CARGO_REGISTRY_TOKEN=" >> "$GITHUB_ENV"
