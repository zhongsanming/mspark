name: Publish to crates.io

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Reads the pinned channel and components from rust-toolchain.toml.
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Publish to crates.io
      uses: katyo/publish-crates@v2
      id: publish-crates
      with:
        registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        ignore-unpublished-changes: true

    - name: Output
      if: fromJSON(steps.publish-crates.outputs.published).*
      run: |
        LIST="${{ join(fromJSON(steps.publish-crates.outputs.published).*.name, ', ') }}"
        echo "Published crates: $LIST"
