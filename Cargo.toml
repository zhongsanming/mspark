[workspace]
members = ["crates/df", "crates/model"]
resolver = "3"

[package]
name = "mspark"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
palc = "0.0.2"
mspark-df = { path = "crates/df" }
mspark-model = { path = "crates/model" }
