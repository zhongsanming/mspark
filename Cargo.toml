[workspace]
members = ["crates/df", "crates/model"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GLWTPL"
repository = "https://github.com/zhongsanming/mspark"
readme = "README.md"
keywords = ["ascend", "npu", "profiling", "msprof"]
categories = ["development-tools::profiling"]

[workspace.dependencies]
# Third-party, shared by more than one crate.
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
zerocopy = { version = "0.8", features = ["derive"] }
palc = "0.0.2"
smallvec = "1"
compact_str = { version = "0.10", features = ["serde"] }

# Internal crates: `path` for the workspace, `version` for publishing.
mspark-df = { version = "0.1.0", path = "crates/df" }
mspark-model = { version = "0.1.0", path = "crates/model" }

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "mspark"
description = "Reimplementation of the MindStudio Profiler (msprof) analysis pipeline: raw Ascend captures to CSVs and a Chrome-trace timeline."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
smallvec.workspace = true
compact_str.workspace = true
palc.workspace = true
mspark-df.workspace = true
mspark-model.workspace = true

[lints]
workspace = true
